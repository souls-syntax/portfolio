<body>

<div id="app">
  <main-layout marquee="Blogs I write in free time, I guess. Don't judge my grammer mou~.">
    <template #default>
      <h1 style="font-size: 1em; margin: 0;">Blog</h1>
      <hr>

      <small>filter by series:</small><br>
      <span id="series-filters"></span>
      <br>
      <small>filter by tag:</small><br>
      <span id="tag-filters"></span>
      <br><br>
	  
      <table width="100%" border="0" cellpadding="2" id="post-list">
	      <!-- posts injected by JS -->
      </table>
      <noscript>
        <h2 style="font-size: 1em;">All Posts</h2>
        <ul>
          <li><a href="posts/realLangs_0.html">Retarded take : Episode 0 : some languages are not real programming language</a> — 2026-06-12</li>
          <li><a href="posts/tsun_0.html">tsundere-runtime, Episode 0 : What I am trying to do with this project, why and how.</a> — 2026-05-25</li>
        </ul>

    </template>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="layouts/main-layout.js"></script>
<script>
  Vue.createApp({}).component('main-layout', MainLayout).mount('#app');
</script>

<script>
function filterPosts(val, by) {
  var rows = document.querySelectorAll('.post-row');
  for (var i = 0; i < rows.length; i++) {
    if (val === 'all') {
      rows[i].style.display = '';
    } else if (by === 'tag') {
      var tags = rows[i].getAttribute('data-tags').split(' ');
      rows[i].style.display = tags.indexOf(val) !== -1 ? '' : 'none';
    } else if (by === 'series') {
      rows[i].style.display = rows[i].getAttribute('data-series') === val ? '' : 'none';
    }
  }
}

fetch('posts.json')
  .then(function(r){ return r.json(); })
  .then(function(posts){
    var list = document.getElementById('post-list');
    if (!list) return;
    list.innerHTML = '';

    // collect unique tags and series
    var allTags = [];
    var allSeries = [];
    for (var i = 0; i < posts.length; i++) {
      var p = posts[i];
      for (var j = 0; j < p.tags.length; j++) {
        if (allTags.indexOf(p.tags[j]) === -1) allTags.push(p.tags[j]);
      }
      if (p.series && allSeries.indexOf(p.series) === -1) allSeries.push(p.series);
    }

    // build filter buttons dynamically
    var seriesBox = document.getElementById('series-filters');
    var tagBox = document.getElementById('tag-filters');

    if (seriesBox) {
      var seriesHtml = '<input type="button" value="all" onclick="filterPosts(\'all\', \'series\')">';
      for (var s = 0; s < allSeries.length; s++) {
        seriesHtml += ' <input type="button" value="' + allSeries[s] + '" onclick="filterPosts(\'' + allSeries[s] + '\', \'series\')">';
      }
      seriesBox.innerHTML = seriesHtml;
    }

    if (tagBox) {
      var tagHtml = '<input type="button" value="all" onclick="filterPosts(\'all\', \'tag\')">';
      for (var t = 0; t < allTags.length; t++) {
        tagHtml += ' <input type="button" value="' + allTags[t] + '" onclick="filterPosts(\'' + allTags[t] + '\', \'tag\')">';
      }
      tagBox.innerHTML = tagHtml;
    }

    // render post rows
    for (var i = 0; i < posts.length; i++) {
      var p = posts[i];
      var tagStr = p.tags.map(function(t){ return '['+t+']'; }).join(' ');
      var readStr = p.readingTime ? ' &middot; ' + p.readingTime + ' min' : '';
      var excerptStr = p.excerpt ? '<br><small style="color:#666;">' + p.excerpt + '</small>' : '';
      var row = document.createElement('tr');
      row.className = 'post-row';
      row.setAttribute('data-tags', p.tags.join(' '));
      row.setAttribute('data-series', p.series || '');
      row.innerHTML =
        '<td><small>' + p.date + '</small></td>' +
        '<td><a href="' + p.url + '">' + p.title + '</a>' + excerptStr + '</td>' +
        '<td><small>' + tagStr + '<br>' + readStr + '</small></td>';
      list.appendChild(row);
    }
  })
  .catch(function(){});
</script>
</body>
