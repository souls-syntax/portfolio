<script>
async function loadArchive() {
  try {
    const res = await fetch('guestbook_stale_comments.json');
    const entries = await res.json();
    const container = document.getElementById('archive-list');
    if (container) {
      container.innerHTML = entries.map(entry => renderEntry(entry)).join('');
    }
  } catch (err) {
    console.error('Failed to load guestbook archive:', err);
  }
}

function renderEntry(entry) {
  const repliesHtml = (entry.replies || [])
    .map(reply => `
      <div class="gb-reply">
        <div class="gb-meta">
          <span class="gb-author">${escapeHtml(reply.author)}</span>
          <span class="gb-date">${formatDate(reply.date)}</span>
        </div>
        <p class="gb-msg">${escapeHtml(reply.message)}</p>
      </div>
    `).join('');

  return `
    <div class="gb-entry">
      <div class="gb-meta">
        <span class="gb-author">${escapeHtml(entry.author)}</span>
        <span class="gb-date">${formatDate(entry.date)}</span>
      </div>
      <p class="gb-msg">${escapeHtml(entry.message)}</p>
      ${repliesHtml}
    </div>
  `;
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadArchive();
</script>
